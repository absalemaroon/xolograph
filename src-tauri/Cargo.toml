[package]
name = "xolograph"
version = "1.3.0"
description = "Xolograph forensic blockchain investigation workbench"
edition = "2021"
rust-version = "1.77"

[lib]
name = "xolograph_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Enabled only by release builds that have an updater signing key (see docs/RELEASING.md).
updater = ["dep:tauri-plugin-updater"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
