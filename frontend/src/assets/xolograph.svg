<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="500" height="500" fill="#000000" />
  
  <!-- Diagonal Connecting Lines -->
  <line x1="160" y1="160" x2="340" y2="340" stroke="#ffffff" stroke-width="4" />
  <line x1="160" y1="340" x2="340" y2="160" stroke="#ffffff" stroke-width="4" />
  
  <!-- Top Left Square (Medium-Small) -->
  <rect x="138" y="138" width="44" height="44" fill="#ffffff" />
  
  <!-- Bottom Left Square (Smallest) -->
  <rect x="148" y="328" width="24" height="24" fill="#ffffff" />
  
  <!-- Top Right Square (Medium-Large) -->
  <rect x="300" y="138" width="64" height="64" fill="#ffffff" />
  
  <!-- Bottom Right Square (Largest) -->
  <rect x="290" y="290" width="86" height="86" fill="#ffffff" />
</svg>