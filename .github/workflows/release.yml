name: Release
on:
  push:
    tags: ['v*']

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-13, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      # Optional features switch on only when their secrets exist (see docs/RELEASING.md).
      HAS_UPDATER: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && secrets.TAURI_UPDATER_PUBKEY != '' }}
      HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      EXTRA_ARGS: ''
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache-dependency-path: |
            backend/go.mod
            backend/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: go mod tidy
        working-directory: backend
      - run: npm install
      - run: npm run engine:build

      - name: Configure auto-update signing
        if: env.HAS_UPDATER == 'true'
        shell: bash
        env:
          UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          REPO: ${{ github.repository }}
        run: |
          node -e "require('fs').writeFileSync('src-tauri/tauri.updater.conf.json', JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.UPDATER_PUBKEY,endpoints:['https://github.com/'+process.env.REPO+'/releases/latest/download/latest.json']}}}))"
          {
            echo "TAURI_SIGNING_PRIVATE_KEY=$SIGNING_KEY"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$SIGNING_KEY_PASSWORD"
            echo "EXTRA_ARGS=$EXTRA_ARGS --features updater --config src-tauri/tauri.updater.conf.json"
          } >> "$GITHUB_ENV"

      - name: Configure macOS signing and notarization
        if: runner.os == 'macOS' && env.HAS_APPLE == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE_B64: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_S: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_S: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_S: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_S: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_S: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE_B64"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD_S"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_S"
            echo "APPLE_ID=$APPLE_ID_S"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD_S"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_S"
          } >> "$GITHUB_ENV"

      - name: Configure Windows code signing
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $pfx = Join-Path $env:RUNNER_TEMP 'xolograph-cert.pfx'
          [IO.File]::WriteAllBytes($pfx, $bytes)
          $secure = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          $conf = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } } | ConvertTo-Json -Depth 5
          Set-Content -Path src-tauri/tauri.windows-sign.conf.json -Value $conf
          "EXTRA_ARGS=$env:EXTRA_ARGS --config src-tauri/tauri.windows-sign.conf.json" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: ${{ env.EXTRA_ARGS }}
          tagName: ${{ github.ref_name }}
          releaseName: 'Xolograph ${{ github.ref_name }}'
          releaseBody: 'See docs/RELEASING.md. Unsigned unless signing secrets were configured; verify checksums before use.'
          releaseDraft: true
          includeUpdaterJson: true
